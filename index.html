<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">

      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"> -->
    <title>Project - Mini Feed UI</title>
</head>
<body>
    <h1>Social Feed</h1>
    <nav id="nav-bar">
        <a href="" class="nav-links">DOM Lesson</a>
        <a href="" class="nav-links">Event Listeners</a>
        <a href="" class="nav-links" id="forms">Forms</a>
    </nav>
    <main class="main-container">
		<form action="" class="form-container" role="search">
			<label for="service-search">Search services</label>
			<div class="search-control">
				<input id="service-search" name="search" type="search" placeholder="Search by service or incident" autocomplete="off">
				<button type="reset">Clear</button>
			</div>
			<p id="result-count" class="result-count" aria-live="polite">Loading services…</p>
		</form>
		<div class="input-wrapper">
			<input type="text" name="input" id="input" class="input" placeholder="Enter item">
			<button type="button" class="addBtn">Add</button>
			<h2 class="output"></h2>
		</div>
		<hr>
		<form action="" class="auth-form" method="get">
		<!-- <form action="" class="auth-form" method="get" onsubmit="return false"> -->
			<input type="text" name="fullName" id="fullName" placeholder="Enter name" style="display: none;">
			<input type="email" name="email" id="email" placeholder="Enter email">
			<input type="password" name="password" id="password" placeholder="Enter password">
			<button class="loginBtn">Login</button>
			<button type="button" class="toggle">Register</button>
		</form>
		<div id="post-list" class="posts">
			<!-- <h3></h3> -->
		</div>
		<button type="button" id="order-by-newest">Sort by Newest</button>
		<button type="button" id="order-by-likes">Sort by Likes</button>
		<button type="button" id="get-posts-by-username">Get Posts by Username</button>
	</main>
    <footer class="footer-container">
        <ol>
            <li>Post</li>
            <li>Like</li>
            <li>Sort</li>
            <li>Search</li>
        </ol>
    </footer>
    <script src="project2.js"></script>
</body>
</html>
